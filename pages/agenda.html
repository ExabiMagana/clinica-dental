<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda — Clínica Dental</title>

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<div id="app-layout"></div>

<div id="app-contenido" style="display:none;">

    <!-- ═══════════════════════════════════════
         Barra superior de vistas + navegación
         ═══════════════════════════════════════ -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-secondary" id="btnSemanaAnterior">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button class="btn btn-outline-secondary" id="btnHoy">Hoy</button>
                <button class="btn btn-outline-secondary" id="btnSemanaSiguiente">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>

            <div class="fw-semibold" id="tituloSemana">—</div>

            <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-primary" id="btnVistaCalendario">
                    <i class="bi bi-calendar3"></i> Calendario
                </button>
                <button class="btn btn-outline-primary" id="btnVistaLista">
                    <i class="bi bi-list-ul"></i> Lista
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         VISTA CALENDARIO (semana)
         ═══════════════════════════════════════ -->
    <div id="vistaCalendario" class="card border-0 shadow-sm mb-3">
        <div class="card-body p-0">
            <div class="calendario-wrapper">
                <!-- Encabezado de días: lo genera el JS -->
                <div class="calendario-header" id="calendarioHeader"></div>

                <!-- Cuerpo: columna de horas + grilla de días -->
                <div class="calendario-body">
                    <div class="calendario-horas" id="calendarioHoras"></div>
                    <div class="calendario-grid" id="calendarioGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         VISTA LISTA (la que ya existía)
         ═══════════════════════════════════════ -->
    <div id="vistaLista">

        <!-- Citas de hoy -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-calendar-day me-1"></i> Citas de hoy</strong>
                <span class="badge bg-primary" id="contadorHoy">0</span>
            </div>
            <div class="card-body">
                <div id="citasHoy" class="row g-2">
                    <div class="col-12 text-center text-muted py-3">Cargando…</div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label mb-1">Desde</label>
                        <input type="date" class="form-control form-control-sm" id="filtroDesde">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1">Hasta</label>
                        <input type="date" class="form-control form-control-sm" id="filtroHasta">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Buscar</label>
                        <input type="text" class="form-control form-control-sm"
                               id="filtroBusqueda" placeholder="Paciente o motivo">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1">Estado</label>
                        <select class="form-select form-select-sm" id="filtroEstado">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button class="btn btn-sm btn-primary flex-grow-1" id="btnBuscar">
                            <i class="bi bi-search"></i> Buscar
                        </button>
                        <button class="btn btn-sm btn-outline-secondary flex-grow-1" id="btnLimpiar">
                            <i class="bi bi-x-circle"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de citas -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span>
                    Listado de citas
                    <span class="badge bg-secondary" id="totalCitas">0</span>
                </span>
                <button class="btn btn-sm btn-success" id="btnNueva">
                    <i class="bi bi-plus-lg"></i> Nueva cita
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Odontólogo</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitas">
                        <tr><td colspan="7" class="text-center text-muted py-4">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                <div class="text-muted small" id="infoPaginacion">—</div>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
                </nav>
            </div>
        </div>
    </div>

</div>

<!-- ══════════════════════════════════════════════
     Modal: Crear / Editar cita
     ══════════════════════════════════════════════ -->
<div class="modal fade" id="modalCita" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="formCita" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Nueva cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="citaId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Paciente *</label>
                            <select class="form-select" id="pacienteId" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Odontólogo *</label>
                            <select class="form-select" id="odontologoId" required></select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Fecha y hora de inicio *</label>
                            <input type="datetime-local" class="form-control" id="fechaInicio" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha y hora de fin *</label>
                            <input type="datetime-local" class="form-control" id="fechaFin" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Motivo</label>
                            <input type="text" class="form-control" id="motivo" maxlength="300">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" rows="2" maxlength="100"></textarea>
                        </div>
                    </div>

                    <div class="alert alert-danger mt-3 d-none" id="erroresFormulario"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardar">
                        <span class="spinner-border spinner-border-sm d-none" id="spinnerGuardar"></span>
                        <span id="textoGuardar">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════
     Modal: Cambiar estado
     ══════════════════════════════════════════════ -->
<div class="modal fade" id="modalEstado" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formEstado" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title">Cambiar estado de la cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="citaIdEstado">

                    <div class="mb-3">
                        <label class="form-label">Nuevo estado *</label>
                        <select class="form-select" id="nuevoEstado" required></select>
                    </div>

                    <div class="mb-0">
                        <label class="form-label">Observaciones (opcional)</label>
                        <textarea class="form-control" id="observacionesEstado" rows="2" maxlength="300"></textarea>
                    </div>

                    <div class="alert alert-danger mt-3 d-none" id="erroresEstado"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnCambiarEstado">
                        <span class="spinner-border spinner-border-sm d-none" id="spinnerEstado"></span>
                        <span id="textoEstado">Cambiar estado</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../js/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/agenda.js"></script>
<script>
    Layout.render({ seccion: "agenda", titulo: "Agenda" });
</script>
</body>
</html>
