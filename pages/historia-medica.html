<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Médica — Clínica Dental</title>

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<div id="app-layout"></div>

<div id="app-contenido" style="display:none;">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0" id="tituloPaciente">Historia Médica</h4>
            <small class="text-muted" id="subtituloPaciente">—</small>
        </div>
        <a href="pacientes.html" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver a pacientes
        </a>
    </div>

    <div id="alertaError" class="alert alert-danger d-none"></div>

    <!-- Observaciones generales -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <label class="form-label fw-semibold">Observaciones generales</label>
            <textarea class="form-control" id="observacionesGenerales" rows="3"
                      placeholder="Notas generales sobre el estado médico del paciente"></textarea>
        </div>
    </div>

    <!-- Preguntas dinámicas -->
    <div id="contenedorPreguntas">
        <div class="text-center text-muted py-4">
            <div class="spinner-border spinner-border-sm me-2"></div>
            Cargando historia médica…
        </div>
    </div>

    <!-- Botón de guardar -->
    <div class="card border-0 shadow-sm mt-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div class="text-muted small" id="infoGuardado">—</div>
            <button class="btn btn-primary" id="btnGuardar">
                <span class="spinner-border spinner-border-sm d-none" id="spinnerGuardar"></span>
                <i class="bi bi-save me-1" id="iconoGuardar"></i>
                <span id="textoGuardar">Guardar cambios</span>
            </button>
        </div>
    </div>

</div>

<script src="../js/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/historia-medica.js"></script>
<script>
    Layout.render({ seccion: "pacientes", titulo: "Historia Médica" });
</script>
</body>
</html>
