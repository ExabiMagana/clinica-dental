<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes — Clínica Dental</title>

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<div id="app-layout"></div>

<div id="app-contenido" style="display:none;">

    <!-- Filtros -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label mb-1">Buscar</label>
                    <input type="text" class="form-control" id="filtroBusqueda"
                           placeholder="Nombre, apellido o documento">
                </div>
                <div class="col-md-2">
                    <label class="form-label mb-1">Estado</label>
                    <select class="form-select" id="filtroActivo">
                        <option value="true" selected>Activos</option>
                        <option value="false">Inactivos</option>
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label mb-1">Sexo</label>
                    <select class="form-select" id="filtroSexo">
                        <option value="">Todos</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" id="btnBuscar">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100" id="btnLimpiar">
                        <i class="bi bi-x-circle"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span>
                Listado de pacientes
                <span class="badge bg-secondary" id="totalPacientes">0</span>
            </span>
            <button class="btn btn-sm btn-success" id="btnNuevo">
                <i class="bi bi-plus-lg"></i> Nuevo paciente
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Edad</th>
                        <th>Sexo</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPacientes">
                    <tr><td colspan="8" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
            <div class="text-muted small" id="infoPaginacion">—</div>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
            </nav>
        </div>
    </div>

</div>

<!-- Modal: Crear / Editar paciente -->
<div class="modal fade" id="modalPaciente" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="formPaciente" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Nuevo paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="pacienteId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombres *</label>
                            <input type="text" class="form-control" id="nombres" required maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellidos *</label>
                            <input type="text" class="form-control" id="apellidos" required maxlength="100">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Documento</label>
                            <input type="text" class="form-control" id="documento" maxlength="30">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha de nacimiento *</label>
                            <input type="date" class="form-control" id="fechaNacimiento" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sexo *</label>
                            <select class="form-select" id="sexo" required>
                                <option value="">Seleccione…</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" maxlength="30">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" id="email" maxlength="150">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion" maxlength="300">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Contacto de emergencia</label>
                            <input type="text" class="form-control" id="contactoEmergenciaNombre" maxlength="150">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono de emergencia</label>
                            <input type="text" class="form-control" id="contactoEmergenciaTelefono" maxlength="30">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" rows="2"></textarea>
                        </div>

                        <div class="col-12" id="contenedorActivo" style="display:none;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="activo">
                                <label class="form-check-label" for="activo">Paciente activo</label>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-danger mt-3 d-none" id="erroresFormulario"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnGuardar">
                        <span class="spinner-border spinner-border-sm d-none" id="spinnerGuardar"></span>
                        <span id="textoGuardar">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../js/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/pacientes-lista.js"></script>
<script>
    Layout.render({ seccion: "pacientes", titulo: "Pacientes" });
</script>
</body>
</html>
